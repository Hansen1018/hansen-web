# Security headers for the hansen-web static export, in the Cloudflare Pages /
# Netlify _headers file format. Mirrors deploy/nginx-security-headers.conf
# (host nginx/OpenResty).
#
# Supported deployment targets out of the box:
#   - Cloudflare Pages   (_headers file)        — drop this file at repo root
#   - Netlify             (_headers file)        — drop this file at repo root
#   - GitHub Pages        (_headers file, partial) — drop this file at repo root
#
# NOT supported:
#   - Vercel — Vercel does not consume the _headers file format. For Vercel
#     deployments, copy the equivalent header rules into vercel.json's
#     `headers` array instead (see https://vercel.com/docs/project-configuration/vercel-json).
#
# CSP whitelist: artalk.hansendong.top (comments), busuanzi.ibruce.info
# (page views), cdnjs.cloudflare.com + cdn.jsdelivr.net (highlight.js,
# PhotoSwipe), www.youtube-nocookie.com (YouTube embeds). wss:// scheme
# is required for Artalk live updates via WebSocket.

/*
  X-Content-Type-Options: nosniff
  X-Frame-Options: DENY
  Referrer-Policy: strict-origin-when-cross-origin
  Permissions-Policy: camera=(), microphone=(), geolocation=()
  Content-Security-Policy: default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://artalk.hansendong.top https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://artalk.hansendong.top https://busuanzi.ibruce.info https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self' https://blog.hansendong.top https://artalk.hansendong.top wss://artalk.hansendong.top https://busuanzi.ibruce.info; frame-src 'self' https://www.youtube-nocookie.com; frame-ancestors 'none'
*/
