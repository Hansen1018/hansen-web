# Security headers for the hansen-web static export served by nginx.
#
# next.config.mjs deliberately does NOT define headers() — Next.js ignores
# that function under output: 'export'. The host (nginx) is responsible for
# these headers. Paste this snippet into the site's nginx server {} block
# (typically /etc/nginx/sites-available/hansen-web.conf on the VPS).
#
# After applying, verify with:
#   curl -fsSI https://hansendong.top/ | grep -iE 'content-security-policy|x-frame-options|referrer-policy|permissions-policy|x-content-type-options'
#
# deploy.sh also performs this verification (checks presence AND value of all 5 headers) and warns if any is missing or mismatched.

# --- Security headers (must match the values previously declared in
# next.config.mjs so that the deployed site behaves identically) ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://artalk.hansendong.top https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://artalk.hansendong.top https://busuanzi.ibruce.info https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self' https://blog.hansendong.top https://artalk.hansendong.top wss://artalk.hansendong.top https://busuanzi.ibruce.info; frame-src 'self' https://www.youtube-nocookie.com; frame-ancestors 'none'" always;

# Optional: hide nginx version in error pages (defense-in-depth).
server_tokens off;
