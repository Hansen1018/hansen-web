<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="10%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.72)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="1200" height="630" fill="#0a0c12"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 顶部装饰条 -->
  <rect x="80" y="80" width="60" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="80" y="120" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18"
        fill="rgba(255,255,255,0.5)" letter-spacing="3">
    👋  HI, I'M
  </text>

  <!-- 主标题 -->
  <text x="80" y="320" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="180" font-weight="700" fill="url(#text)" letter-spacing="-7">
    Hansen.
  </text>

  <!-- 副标题 -->
  <text x="84" y="380" font-family="Inter, system-ui, sans-serif" font-size="32"
        font-weight="500" fill="rgba(255,255,255,0.85)" letter-spacing="-0.5">
    Vibe Coding 工程师 · 1989 · 深圳
  </text>

  <!-- 描述 -->
  <text x="84" y="430" font-family="Inter, sans-serif" font-size="22"
        font-weight="400" fill="rgba(255,255,255,0.55)">
    完美主义者 · 草根博主 · 客制外设经销 · PT 刷流
  </text>

  <!-- 底部状态 / 链接 -->
  <g transform="translate(80, 540)">
    <circle cx="8" cy="-6" r="6" fill="#22c55e"/>
    <circle cx="8" cy="-6" r="6" fill="#22c55e" opacity="0.4">
      <animate attributeName="r" values="6;14;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="0" font-family="ui-monospace, monospace" font-size="18"
          fill="rgba(255,255,255,0.6)" letter-spacing="0.5">
      Home · 开放约稿
    </text>
  </g>

  <g transform="translate(820, 540)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="18"
          fill="rgba(255,255,255,0.6)" text-anchor="start" letter-spacing="0.5">
      github.com/Hansen1018  →
    </text>
  </g>

  <!-- 底部域名 -->
  <text x="600" y="600" font-family="ui-monospace, monospace" font-size="14"
        fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="2">
    HANSENDONG.TOP
  </text>
</svg>
