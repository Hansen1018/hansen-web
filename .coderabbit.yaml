# .coderabbit.yaml — CodeRabbit AI code review configuration
# Docs: https://docs.coderabbit.ai/
#
# Free tier covers public repos on GitHub. After installing the GitHub App
# from https://github.com/apps/coderabbitai and granting access to this repo,
# CodeRabbit will auto-review every PR against main and surface:
#   - Vue 3 <script setup> / Options API anti-patterns
#   - accessibility gaps (a11y) in templates
#   - missing alt / loading / decoding on <img>
#   - inline event handlers (XSS surface)
#   - shell script bugs in deploy.sh (shellcheck)
#   - secrets / tokens in commit ranges (gitleaks)
#   - GitHub Actions workflow lint (actionlint)

language: en

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  abort_on_transient_error: false
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DRAFT"
      - "skip-review"
    base_branches:
      - main
  tools:
    markdownlint: { enabled: true }
    yamllint: { enabled: true }
    gitleaks: { enabled: true }
    actionlint: { enabled: true }
    ast-grep: { enabled: true }
    shellcheck: { enabled: true }
    github-checks: { enabled: true, min_position: 5 }
    languagetool: { enabled: true, level: default }
    eslint: { enabled: false }
    biome: { enabled: false }
    ruff: { enabled: false }
    golangci-lint: { enabled: false }
    phpstan: { enabled: false }
    phpcs: { enabled: false }
    swiftlint: { enabled: false }
    detekt: { enabled: false }
    rubocop: { enabled: false }
    flake8: { enabled: false }
    buf: { enabled: false }
    hadolint: { enabled: false }
    checkov: { enabled: false }

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: global
  issues:
    scope: global
